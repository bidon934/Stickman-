<!doctype html>
<html lang="id"><head><meta charset="utf-8">
<title>Stickman 3D Hand Tracker</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>
:root{--bg:#eef1f6;--fg:#1c2230;--line:#1c2230;--ui:#ffffffd9;--accent:#2f6bff;color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#10141c;--fg:#e8ecf4;--line:#f2f5fa;--ui:#1b2230d9;--accent:#6b97ff;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#10141c;--fg:#e8ecf4;--line:#f2f5fa;--ui:#1b2230d9;--accent:#6b97ff;color-scheme:dark}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--fg);font-family:system-ui,-apple-system,sans-serif;overflow:hidden;touch-action:none}
#stage{position:relative;width:100%;height:100%}
#gl{width:100%;height:100%;display:block}
#pv{position:absolute;top:10px;right:10px;width:120px;height:90px;border-radius:10px;border:2px solid var(--accent);background:var(--ui)}
#hud{position:absolute;left:10px;right:144px;top:10px;font-size:13px;line-height:1.35;background:var(--ui);padding:8px 10px;border-radius:10px}
#bar{position:absolute;left:0;right:0;bottom:14px;display:flex;gap:10px;justify-content:center}
button{font:600 15px system-ui;padding:12px 18px;border:0;border-radius:12px;background:var(--accent);color:#fff}
button:disabled{opacity:.4}
#v{position:absolute;width:1px;height:1px;opacity:0;pointer-events:none}
</style></head><body>
<div id="stage">
  <canvas id="gl"></canvas>
  <canvas id="pv"></canvas>
  <div id="hud">Tekan <b>Mulai Kamera</b>. Atau geser jari di layar untuk menggerakkan tangan kanan stickman.</div>
  <div id="bar"><button id="start">Mulai Kamera</button><button id="cal" disabled>Kalibrasi</button></div>
  <video id="v" playsinline muted></video>
</div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
const V=THREE.Vector3, css=getComputedStyle(document.documentElement);
const lineColor=css.getPropertyValue('--line').trim()||'#222', accentColor=css.getPropertyValue('--accent').trim()||'#2f6bff';
const stage=document.getElementById('stage'), cv=document.getElementById('gl'), hud=document.getElementById('hud');
const setS=t=>hud.innerHTML=t;
const renderer=new THREE.WebGLRenderer({canvas:cv,antialias:true,alpha:true});
renderer.setPixelRatio(Math.min(devicePixelRatio,2));
const scene=new THREE.Scene();
const cam=new THREE.PerspectiveCamera(45,1,.1,60);
function resize(){const w=stage.clientWidth,h=stage.clientHeight;renderer.setSize(w,h,false);cam.aspect=w/h;cam.updateProjectionMatrix();
  cam.position.set(0,1.2,7*Math.max(1,.95/cam.aspect));cam.lookAt(0,.9,0);}
addEventListener('resize',resize);resize();
scene.add(new THREE.AmbientLight(0xffffff,.75));
const dl=new THREE.DirectionalLight(0xffffff,.8);dl.position.set(3,6,5);scene.add(dl);
const grid=new THREE.GridHelper(14,14,accentColor,lineColor);grid.position.y=-1.9;grid.material.opacity=.25;grid.material.transparent=true;scene.add(grid);

const mat=new THREE.MeshStandardMaterial({color:lineColor,roughness:.5}), acc=new THREE.MeshStandardMaterial({color:accentColor,roughness:.4});
const Y=new V(0,1,0);
function mkLimb(r){const m=new THREE.Mesh(new THREE.CylinderGeometry(r,r,1,12),mat);scene.add(m);return m}
function mkBall(r,m=mat){const s=new THREE.Mesh(new THREE.SphereGeometry(r,18,14),m);scene.add(s);return s}
function setLimb(m,a,b){const d=b.clone().sub(a),L=d.length()||1e-4;m.position.copy(a).addScaledVector(d,.5);m.quaternion.setFromUnitVectors(Y,d.normalize());m.scale.set(1,L,1)}
function ik(s,t,l1,l2,pole){const d=t.clone().sub(s);let dist=d.length()||1e-4;d.divideScalar(dist);
  dist=Math.min(dist,l1+l2-1e-3);dist=Math.max(dist,Math.abs(l1-l2)+1e-3);
  const a=(l1*l1-l2*l2+dist*dist)/(2*dist),h=Math.sqrt(Math.max(l1*l1-a*a,0));
  const mid=s.clone().addScaledVector(d,a),pp=pole.clone().addScaledVector(d,-pole.dot(d));
  if(pp.lengthSq()<1e-6)pp.set(0,-1,0);pp.normalize();
  return{elbow:mid.addScaledVector(pp,h),end:s.clone().addScaledVector(d,dist)}}

const torso=mkLimb(.07), head=mkBall(.32), neckBall=mkBall(.08);
const arms=[-1,1].map(side=>({side,a:mkLimb(.06),b:mkLimb(.055),e:mkBall(.075),h:mkBall(.12,acc),tgt:new V(side*.5,-.3,.1),cur:new V(side*.5,-.3,.1),miss:99,vis:false}));
const legs=[-1,1].map(side=>({side,a:mkLimb(.07),b:mkLimb(.065),k:mkBall(.085),f:mkBall(.1)}));

const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
const toWorld=(nx,ny,s)=>new V((nx-.5)*5.5,1.2+(.5-ny)*4.5,clamp((s-.3)*6,-.6,1.8));
let lean=0,phase=0,act=0,last=performance.now();
function updateRig(dt){
  const on=arms.filter(a=>a.vis);
  const avgx=on.length?on.reduce((s,a)=>s+a.tgt.x,0)/on.length:0;
  lean+=(avgx*.08-lean)*.1;
  const hip=new V(0,0,0), neck=new V(Math.sin(lean)*1.3,Math.cos(lean)*1.3,0);
  setLimb(torso,hip,neck);neckBall.position.copy(neck);
  head.position.set(neck.x+Math.sin(lean)*.4,neck.y+Math.cos(lean)*.4,0);
  let speed=0;
  arms.forEach(a=>{
    const sh=neck.clone().add(new V(a.side*.15,-.1,0));
    const t=a.vis?a.tgt:sh.clone().add(new V(a.side*.3,-1.55,.1));
    const prev=a.cur.clone();a.cur.lerp(t,a.vis?.35:.12);
    speed+=a.cur.distanceTo(prev)/Math.max(dt,.001);
    const r=ik(sh,a.cur,.8,.8,new V(a.side*.6,-1,-.5));
    setLimb(a.a,sh,r.elbow);setLimb(a.b,r.elbow,r.end);a.e.position.copy(r.elbow);a.h.position.copy(r.end);
  });
  act+=(Math.min(speed,6)-act)*.08;
  phase+=dt*(3+act*2);
  const amp=act>.8?Math.min(act*.12,.4):0;
  legs.forEach((l,i)=>{
    const w=Math.sin(phase+(i?Math.PI:0));
    const foot=new V(l.side*.3,-1.8+Math.max(0,w)*amp,w*amp*.6);
    const r=ik(hip.clone().add(new V(l.side*.1,0,0)),foot,1,1,new V(0,0,1));
    setLimb(l.a,hip.clone().add(new V(l.side*.1,0,0)),r.elbow);setLimb(l.b,r.elbow,r.end);l.k.position.copy(r.elbow);l.f.position.copy(r.end);
  });
}

/* --- Tracking kamera: warna kulit + pengurangan latar --- */
const W=96,H=72,pc=document.getElementById('pv'),px=pc.getContext('2d',{willReadFrequently:true});
pc.width=W;pc.height=H;
const vid=document.getElementById('v');
let stream=null,bg=null,cal=null,ptr=null;
async function startCam(){
  try{
    stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:'user',width:{ideal:640},height:{ideal:480}},audio:false});
    vid.srcObject=stream;await vid.play();
    document.getElementById('cal').disabled=false;document.getElementById('start').disabled=true;
    setS('Kamera aktif. Keluarkan tangan dari frame, lalu tekan <b>Kalibrasi</b>.');
  }catch(e){setS('Kamera gagal: '+(e.message||e.name)+'. Buka link ini langsung di browser dan izinkan kamera. Sementara itu, geser jari di layar.')}
}
document.getElementById('start').onclick=startCam;
document.getElementById('cal').onclick=()=>{cal={t0:performance.now()};bg=null};

function track(now){
  px.save();px.translate(W,0);px.scale(-1,1);px.drawImage(vid,0,0,W,H);px.restore();
  const img=px.getImageData(0,0,W,H),d=img.data;
  if(cal){
    const t=now-cal.t0;
    if(t<3000){setS('Kosongkan tangan dari frame… '+Math.ceil((3000-t)/1000));return}
    if(!cal.acc){cal.acc=new Float32Array(d.length);cal.n=0}
    if(cal.n<8){for(let i=0;i<d.length;i++)cal.acc[i]+=d[i];cal.n++;setS('Merekam latar…');return}
    bg=cal.acc.map(v=>v/cal.n);cal=null;setS('Siap! Masukkan tangan ke kamera. Dekatkan tangan = maju ke depan.');
  }
  if(!bg)return;
  const pts=[[],[]];
  for(let p=0,i=0;p<W*H;p++,i+=4){
    const r=d[i],g=d[i+1],b=d[i+2],y=.299*r+.587*g+.114*b,cb=128-.1687*r-.3313*g+.5*b,cr=128+.5*r-.4187*g-.0813*b;
    if(y>35&&cb>77&&cb<127&&cr>133&&cr<173&&Math.abs(r-bg[i])+Math.abs(g-bg[i+1])+Math.abs(b-bg[i+2])>60){
      const x=p%W;pts[x<W/2?0:1].push(x,(p/W)|0);d[i]=0;d[i+1]=255;d[i+2]=120}
  }
  px.putImageData(img,0,0);
  for(let k=0;k<2;k++){
    const a=pts[k],n=a.length/2,arm=arms[k];
    if(n>35){
      let mn=1e9,mx=0;for(let j=1;j<a.length;j+=2){if(a[j]<mn)mn=a[j];if(a[j]>mx)mx=a[j]}
      const lim=mn+(mx-mn)*.45;let sx=0,sy=0,c=0;
      for(let j=1;j<a.length;j+=2)if(a[j]<=lim){sx+=a[j-1];sy+=a[j];c++}
      arm.tgt.copy(toWorld(sx/c/W,sy/c/H,Math.sqrt(n/(W*H))));arm.miss=0;
    }else arm.miss++;
    arm.vis=arm.miss<8;
  }
}

/* Cadangan: geser jari/mouse = tangan kanan */
stage.addEventListener('pointerdown',e=>{if(e.target.tagName!=='BUTTON')ptr=e});
stage.addEventListener('pointermove',e=>{if(ptr)ptr=e});
addEventListener('pointerup',()=>ptr=null);

function loop(now){
  requestAnimationFrame(loop);
  const dt=Math.min((now-last)/1000,.1);last=now;
  if(stream&&vid.readyState>=2)track(now);
  if(ptr&&!arms[1].vis){const r=stage.getBoundingClientRect();
    arms[1].tgt.copy(toWorld((ptr.clientX-r.left)/r.width,(ptr.clientY-r.top)/r.height,.3));arms[1].vis=true;arms[1].miss=0}
  updateRig(dt);
  renderer.render(scene,cam);
}
requestAnimationFrame(loop);
</script></body></html>
